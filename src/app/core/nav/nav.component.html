<!-- Header -->
<header id="header" class="bg-secondary">
  <nav class="container mx-auto flex justify-between items-center py-8 px-4">
    <!-- App Name -->
    <a class="text-3xl text-indigo-400 font-bold uppercase mr-4" routerLink="/"
      >Clips</a
    >

    <div class="flex flex-grow justify-end items-center">
      <!-- Primary Navigation -->
      <ul class="flex flex-row mt-1">
        <!-- Navigation Links -->
        @if (auth.authState$ | async) {
          <li>
            <a
              class="px-2"
              routerLink="/manage"
              routerLinkActive="text-indigo-400"
              >Manage</a
            >
          </li>
          <li>
            <a
              class="px-2"
              routerLink="/upload"
              routerLinkActive="text-indigo-400"
              >Upload</a
            >
          </li>
          <li>
            <a class="px-2" (click)="auth.logout($event)">Log Out</a>
          </li>
        } @else {
          <li>
            <a class="px-2" href="#" (click)="openModal($event)"
              >Login / Register</a
            >
          </li>
        }
      </ul>
    </div>
  </nav>
</header>
